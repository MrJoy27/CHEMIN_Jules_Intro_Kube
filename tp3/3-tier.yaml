apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:13
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "reviews"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-3-tier-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-3-tier
  template:
    metadata:
      labels:
        app: backend-3-tier
    spec:
      containers:
      - name: backend-3-tier
        image: hugosmn5/backend-3-tier:1.1
        ports:
        - containerPort: 5000
        env:
        - name: DB_USER
          value: "admin"
        - name: DB_PASS
          value: "password"
        - name: DB
          value: "reviews"
        - name: DB_HOST
          value: "postgres-service"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-3-tier-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-3-tier
  template:
    metadata:
      labels:
        app: frontend-3-tier
    spec:
      containers:
      - name: frontend-3-tier
        image: hugosmn5/frontend-3-tier:1.1
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend-3-tier
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend-3-tier
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
spec:
  rules:
  - host: frontend-jchemin.lab.sspcloud.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 5000
